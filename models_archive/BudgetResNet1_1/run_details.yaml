data:
  root: ./dataset
  training_split: train
  validation_split: val

model:
  name: BudgetResNet1_1
  input_resolution: [124, 124]
  input_channels: 3
  stem:
    convolution_channels: [3, 12]
    convolution_kernel_size: 5
    convolution_stride: 2
    convolution_padding: 2
    convolution_bias: false
    batch_normalization: true
    activation: ReLU
    max_pool: false
    output_resolution: [62, 62]
    trainable_params: 924
  bottleneck:
    convolution_kernel_sizes: [1, 3, 1]
    convolution_strides: [1, 1, 1]
    convolution_padding: [0, 1, 0]
    middle_convolution: depthwise
    middle_convolution_groups: bottleneck_channels
    convolution_bias: false
    batch_normalization: true
    activation: ReLU
    shortcut_addition_activation: ReLU
  stages:
    stage_1:
      blocks:
        - type: identity
          channels: [12, 10, 10, 12]
          output_resolution: [62, 62]
          trainable_params: 394
        - type: identity
          channels: [12, 10, 10, 12]
          output_resolution: [62, 62]
          trainable_params: 394
        - type: projection_downsample
          channels: [12, 10, 10, 16]
          convolution_strides: [1, 2, 1]
          shortcut_projection: [12, 16]
          output_resolution: [31, 31]
          trainable_params: 666
    stage_2:
      blocks:
        - type: identity
          channels: [16, 10, 10, 16]
          output_resolution: [31, 31]
          trainable_params: 482
        - type: identity
          channels: [16, 10, 10, 16]
          output_resolution: [31, 31]
          trainable_params: 482
        - type: projection_downsample
          channels: [16, 12, 12, 24]
          convolution_strides: [1, 2, 1]
          shortcut_projection: [16, 24]
          output_resolution: [16, 16]
          trainable_params: 1116
    stage_3:
      blocks:
        - type: identity
          channels: [24, 20, 20, 24]
          output_resolution: [16, 16]
          trainable_params: 1268
        - type: identity
          channels: [24, 20, 20, 24]
          output_resolution: [16, 16]
          trainable_params: 1268
        - type: projection_downsample
          channels: [24, 20, 20, 32]
          convolution_strides: [1, 2, 1]
          shortcut_projection: [24, 32]
          output_resolution: [8, 8]
          trainable_params: 2276
  downsampling:
    residual_stride_location: depthwise_3x3_convolution
    projection_kernel_size: 1
    projection_stride: 2
    projection_batch_normalization: true
  global_average_pooling: true
  classifier_input_features: 32
  num_classes: 10
  classifier_bias: true
  classifier_trainable_params: 330

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  optimizer: AdamW
  weight_decay: 0.00001
  loss: CrossEntropyLoss
  early_stopping_patience: 20
  checkpoint_selection: highest_validation_accuracy_then_lowest_validation_loss
  seed: 42
  cpu_threads: 10
  data_loader_workers: 0
  warmup_epochs: 5
  warmup_start_factor: 0.1
  warmup_end_factor: 1.0
  warmup_interval: batch

preprocessing:
  resize: [124, 124]
  antialias: true
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [1.0, 1.0, 1.0]

augmentation:
  per_transform_probability: 0.5
  horizontal_flip: true
  affine:
    degrees: 10
    scale: [0.9, 1.1]
    interpolation: bilinear
    fill: 128
  color_jitter:
    brightness: 0.1
    contrast: 0.1
  random_erasing:
    scale: [0.02, 0.08]
    ratio: [0.5, 2.0]
    value: 0.0
